<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">From Vibes to Verifiable</title>
  <desc id="d">If it acts, it needs evidence. Runtime, Skills, Boundary, Tests. Companion repository for talks in Manila and Kuala Lumpur, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#FFB900"/>
      <stop offset="35%" stop-color="#EAA300"/>
      <stop offset="72%" stop-color="#F7630C"/>
      <stop offset="100%" stop-color="#F7894A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#241A12" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect x="72" y="72" width="4" height="120" fill="#241A12"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" fill="#241A12">
    <text x="96" y="100" font-size="15" font-weight="600" letter-spacing="3">REALACTIVITY  /  MANILA + KUALA LUMPUR  /  2026</text>
    <text x="94" y="152" font-size="54" font-weight="600" letter-spacing="-0.5">From Vibes to Verifiable</text>
    <text x="96" y="194" font-size="21">If it acts, it needs evidence.</text>
    <g font-size="13" letter-spacing="2.5" font-weight="600">
      <rect x="96" y="246" width="150" height="40" rx="6" fill="#FFB900" stroke="#241A12" stroke-opacity="0.6"/>
      <text x="171" y="271" text-anchor="middle">RUNTIME</text>
      <rect x="262" y="246" width="150" height="40" rx="6" fill="#EAA300" stroke="#241A12" stroke-opacity="0.6"/>
      <text x="337" y="271" text-anchor="middle">SKILLS</text>
      <rect x="428" y="246" width="150" height="40" rx="6" fill="#F7630C" stroke="#241A12" stroke-opacity="0.6"/>
      <text x="503" y="271" text-anchor="middle">BOUNDARY</text>
      <rect x="594" y="246" width="150" height="40" rx="6" fill="#F7894A" stroke="#241A12" stroke-opacity="0.6"/>
      <text x="669" y="271" text-anchor="middle">TESTS</text>
    </g>
    <text x="96" y="318" font-size="13">What executes   ·   When it should act   ·   What data can move   ·   What proves behavior</text>
  </g>
  <g transform="translate(930 84)" fill="none" stroke="#241A12" stroke-linecap="round">
    <circle cx="120" cy="96" r="88" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="120" cy="96" r="62" stroke-opacity="0.26" stroke-width="1.5"/>
    <circle cx="120" cy="96" r="36" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M104 97 l11 11 l22 -24" stroke-width="4"/>
  </g>
